# Resource review bundle for PRs that touch resource definitions or
# platform handlers.
#
# Runs tools/review-bundle against a freshly provisioned throwaway PingOne
# environment (same provisioning path as regression-provisioned.yaml) and
# posts the resulting bundle (definition summary, review checklist, live
# export HCL, raw API snapshots, HTML review page) as a workflow artifact
# with a PR comment linking to it. The bundle is the human-reviewable
# evidence accompanying every resource-adding or resource-changing PR; the
# checklist inside it is what reviewers work through.
#
# The paths filter is deliberate: PRs that touch neither definitions/ nor
# internal/platform/ have no resource changes to review, and each run costs
# a real environment. Concurrency cancels superseded runs on the same PR.
#
# Security: org-admin credentials (create/delete environment only) live in
# the "regression-provision" GitHub Environment (required-reviewer gating,
# same as regression-provisioned.yaml), so fork PRs cannot execute against
# PingOne without maintainer approval. The review tool itself secret-scans
# the finished bundle for the client secret and deletes it on a hit;
# meta.json records the target environment ID only, never credentials.

name: review-bundle

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'definitions/**'
      - 'internal/platform/**'

concurrency:
  group: review-bundle-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # ─── Job 1: Detect changed resource types (no credentials) ──────────
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.detect.outputs.has_changes }}
      types: ${{ steps.detect.outputs.types }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history: change detection diffs against the PR base SHA.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Detect changed resource types
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Removed types appear in the diff but have nothing to review or
          # export; the tool's --detect-only JSON reports the changed,
          # non-removed seed types under resource_types and the
          # dependency-closed review set under closure.
          json=$(go run ./tools/review-bundle/ --detect-only --base-ref "${BASE_SHA}")

          seed_count=$(jq '.resource_types | length' <<<"${json}")
          type_count=$(jq '.closure | length' <<<"${json}")

          if [ "${seed_count}" -eq 0 ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "types=" >> "$GITHUB_OUTPUT"
            echo "No resource definition or handler changes detected."
            exit 0
          fi

          # Pass the seeds, not the closure: the tool recomputes the closure
          # itself and the closure may exceed the 32KB step-output limit on
          # platform-wide changes.
          types=$(jq -r '.resource_types | join(",")' <<<"${json}")
          {
            echo "has_changes=true"
            echo "types=${types}"
          } >> "$GITHUB_OUTPUT"

          echo "Detected ${seed_count} changed type(s); review closure ${type_count} type(s):"
          jq -r '.resource_types[]' <<<"${json}" | sed 's/^/  /'

  # ─── Job 2: Provision, export, snapshot, render the bundle ──────────
  bundle:
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    environment: regression-provision
    env:
      REVIEW_BASE: ${{ github.event.pull_request.base.sha }}
      RESOURCE_TYPES: ${{ needs.detect.outputs.types }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.6'

      # Provisions the throwaway environment (never the review tool). The
      # result JSON holds the worker client secret - parsed with jq into env
      # vars, never echoed, deleted immediately.
      - name: Provision throwaway environment
        run: |
          set -euo pipefail
          go build -o tf-regression-provision ./tools/tf-regression-provision/

          result=$(mktemp)
          ./tf-regression-provision \
            --action create \
            --terraform-dir terraform-test-data/root \
            --name-prefix pingcli-review-bundle \
            >"${result}"

          echo "PROVISIONED_ENV_ID=$(jq -r '.target_environment_id' "${result}")" >> "$GITHUB_ENV"
          echo "PINGCLI_PINGONE_ENVIRONMENT_ID=$(jq -r '.auth_environment_id' "${result}")" >> "$GITHUB_ENV"
          echo "PINGCLI_PINGONE_EXPORT_ENVIRONMENT_ID=$(jq -r '.target_environment_id' "${result}")" >> "$GITHUB_ENV"
          echo "PINGCLI_PINGONE_CLIENT_CREDENTIALS_CLIENT_ID=$(jq -r '.client_id' "${result}")" >> "$GITHUB_ENV"
          echo "PINGCLI_PINGONE_CLIENT_CREDENTIALS_CLIENT_SECRET=$(jq -r '.client_secret' "${result}")" >> "$GITHUB_ENV"
          echo "PINGCLI_PINGONE_REGION_CODE=$(jq -r '.region_code' "${result}")" >> "$GITHUB_ENV"
          rm -f "${result}"

      - name: Generate review bundle
        run: |
          set -euo pipefail
          args=(--base-ref "${REVIEW_BASE}" --out review-bundle)
          if [ -n "${RESOURCE_TYPES}" ]; then
            args+=(--resource-types "${RESOURCE_TYPES}")
          fi
          go run ./tools/review-bundle/ "${args[@]}"

      - name: Tear down provisioned environment
        if: always()
        run: |
          ./tf-regression-provision --action destroy --terraform-dir terraform-test-data/root \
            || echo "::warning::Teardown reported an error - verify manually in the PingOne admin console."

      - name: Upload review bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-bundle-pr${{ github.event.pull_request.number }}
          path: review-bundle/
          if-no-files-found: ignore
          retention-days: 14

      # Checklist highlights for the comment body: WARN rows need a fix or a
      # justification in the PR; CHECK rows need an explicit reviewer note.
      - name: Prepare PR comment
        id: comment
        run: |
          set -euo pipefail
          {
            echo "body<<ENDOFCOMMENT"
            echo "## 📦 Resource review bundle"
            echo ""
            echo "Reviewing: ${{ needs.detect.outputs.types }}"
            echo ""
            echo "The full bundle (definition summary, review checklist, live export HCL, raw API snapshots, HTML review page) is in the [\`review-bundle-pr${{ github.event.pull_request.number }}\`](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) workflow artifact."
            echo ""
            if [ -f review-bundle/meta.json ]; then
              skipped=$(jq -r '.skipped_live // {} | to_entries[] | "\(.key): \(.value)"' review-bundle/meta.json 2>/dev/null || true)
              if [ -n "${skipped}" ]; then
                echo "**Skipped from the live export** (service unavailable in the SSO-only throwaway environment, see #163):"
                echo '```'
                echo "${skipped}"
                echo '```'
                echo ""
              fi
            fi
            if [ -f review-bundle/checklist.md ]; then
              warns=$(grep -c '\*\*\[WARN\]\*\*' review-bundle/checklist.md || true)
              checks=$(grep -c '\*\*\[CHECK\]\*\*' review-bundle/checklist.md || true)
              echo "Checklist: ${warns} WARN, ${checks} CHECK row(s)."
              if [ "${warns}" -gt 0 ]; then
                echo ""
                echo "<details>"
                echo "<summary>WARN rows (need a fix or a justification in the PR)</summary>"
                echo ""
                echo '```'
                grep '\*\*\[WARN\]\*\*' review-bundle/checklist.md
                echo '```'
                echo ""
                echo "</details>"
              fi
            fi
            echo ""
            echo "---"
            echo "*Generated by the review-bundle workflow • [View run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})*"
            echo "ENDOFCOMMENT"
          } >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.comment.outputs.body }}
