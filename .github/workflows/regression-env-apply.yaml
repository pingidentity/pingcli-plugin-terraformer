# Repair the static PingOne regression environment from its Terraform config.
#
# tests/regression/environment/ is the management config for the environment
# that regression.yaml exports from. When that environment drifts (manual
# edits, mutations, loss), this workflow plans and applies the committed
# config to converge it back. State lives in the S3 backend configured in
# tests/regression/environment (bucket/region/key supplied at init from the
# TERRAFORM_PROVIDER_ENV_BASE64 blob).
#
# Manual workflow_dispatch only — never scheduled, never triggered by push
# or PR. mode=plan produces a plan artifact for review; mode=apply applies
# that exact plan file.
#
# Secrets (repo-level; the repo does not use the GH environments feature):
#   - TERRAFORM_PROVIDER_ENV_BASE64 — shell exports for the provider and
#     backend: AWS credentials (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY),
#     state bucket config (TF_VAR_tf_state_bucket, TF_VAR_tf_state_region),
#     and the write-scoped PingOne worker credentials (PINGONE_CLIENT_ID,
#     PINGONE_CLIENT_SECRET, PINGONE_ENVIRONMENT_ID, PINGONE_REGION_CODE).
#     Same shape as the pipeline-example-platform-test repo's localsecrets.
#   - TERRAFORM_TFVARS_BASE64 — base64 of the exported
#     ping-export-terraform.auto.tfvars file (generated by
#     tests/regression/environment/export.sh against the live environment).
#     Decoded in place as that exact filename so Terraform auto-loads it.
#
# Security:
#   - PingOne credentials here are a dedicated write-scoped worker app
#     (regression-env-tf-writer), separate from the read-only worker used by
#     regression.yaml.
#   - Connector instance properties are lifecycle-ignored in the config, so
#     apply can never overwrite live clientSecrets with empty values.
#   - Secret files are decoded to 0600 temp files and deleted on exit.

name: regression-env-apply

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan = review only; apply = converge the environment"
        type: choice
        default: plan
        options:
          - plan
          - apply
      target:
        description: "Optional Terraform -target=module.ping-export.<type>.<label> to scope the repair"
        required: false
        default: ""

concurrency:
  group: regression-env-apply
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.6
          terraform_wrapper: false

      - name: Write secrets files
        env:
          TERRAFORM_PROVIDER_ENV_BASE64: ${{ secrets.TERRAFORM_PROVIDER_ENV_BASE64 }}
          TERRAFORM_TFVARS_BASE64: ${{ secrets.TERRAFORM_TFVARS_BASE64 }}
        working-directory: tests/regression/environment
        run: |-
          umask 077
          _provider_env=$(mktemp)
          printf '%s' "${TERRAFORM_PROVIDER_ENV_BASE64}" | base64 -d > "${_provider_env}"
          echo "_provider_env=${_provider_env}" >> "${GITHUB_ENV}"
          printf '%s' "${TERRAFORM_TFVARS_BASE64}" | base64 -d > ping-export-terraform.auto.tfvars
          # NOTE: no trap rm here — a step-local trap fires when THIS step's
          # shell exits, before later steps source the file. Cleanup happens
          # in the "Clean up secrets files" step (if: always()).

      - name: Terraform init
        working-directory: tests/regression/environment
        run: |-
          umask 077
          # set -a: auto-export sourced vars so the terraform subprocess
          # inherits AWS_*/PINGONE_*/TF_VAR_* (the blob uses dotenv-style
          # assignments, not export statements).
          set -a
          . "${_provider_env}"
          set +a
          # Key convention from the localsecrets prefix
          # (TF_VAR_tf_state_key_prefix/regression-environment/terraform.tfstate).
          : "${TF_VAR_tf_state_key_prefix:=regression-environment}"
          terraform init -input=false \
            -backend-config="bucket=${TF_VAR_tf_state_bucket}" \
            -backend-config="region=${TF_VAR_tf_state_region}" \
            -backend-config="key=${TF_VAR_tf_state_key_prefix}/regression-environment/terraform.tfstate" \
            -backend-config="encrypt=true"

      - name: Terraform plan
        working-directory: tests/regression/environment
        run: |-
          set -a
          . "${_provider_env}"
          set +a
          set +e
          _args=(-input=false -detailed-exitcode -out=plan.tfplan)
          if [ -n "${{ inputs.target }}" ]; then
            _args+=(-target="${{ inputs.target }}")
          fi
          terraform plan "${_args[@]}"
          _code=$?
          # 0 = no changes; 1 = error (fail the run); 2 = drift found (the
          # expected case for a repair run — keep the plan artifact).
          if [ "${_code}" -eq 1 ]; then
            exit 1
          fi
          exit 0

      - name: Render plan summary
        if: always()
        working-directory: tests/regression/environment
        run: |-
          if [ -f plan.tfplan ]; then
            terraform show -no-color plan.tfplan >> "${GITHUB_STEP_SUMMARY}" || true
          fi

      - name: Upload plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-env-tfplan
          path: tests/regression/environment/plan.tfplan
          retention-days: 7

      - name: Terraform apply
        if: ${{ inputs.mode == 'apply' }}
        working-directory: tests/regression/environment
        run: terraform apply -input=false -auto-approve plan.tfplan

      - name: Post-apply verification plan
        if: ${{ inputs.mode == 'apply' }}
        working-directory: tests/regression/environment
        run: |-
          # After a successful convergence this must exit 0 ("no changes").
          # Any diff here means the apply did not fully converge — investigate
          # before dispatching apply again.
          terraform plan -input=false -detailed-exitcode

      - name: Clean up secrets files
        if: always()
        working-directory: tests/regression/environment
        run: |-
          rm -f ping-export-terraform.auto.tfvars
          if [ -n "${_provider_env:-}" ] && [ -f "${_provider_env}" ]; then
            rm -f "${_provider_env}"
          fi
