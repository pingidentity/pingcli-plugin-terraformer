# PingOne Password Policy Resource Definition
#
# SDK: github.com/patrickcping/pingone-go-sdk-v2/management, type PasswordPolicy.
# Referenced by pingone_population.password_policy.id and
# pingone_population_default.password_policy.id — implemented alongside
# those to avoid an avoidable fallback-variable placeholder.

metadata:
  platform: pingone
  resource_type: pingone_password_policy
  api_type: PasswordPolicy
  name: PingOne Password Policy
  short_name: password_policy
  version: "1.0"

api:
  sdk_package: github.com/patrickcping/pingone-go-sdk-v2/management
  sdk_type: PasswordPolicy
  list_method: PasswordPoliciesApi.ReadAllPasswordPolicies
  get_method: PasswordPoliciesApi.ReadOnePasswordPolicy
  id_field: id
  name_field: name
  pagination_type: cursor

attributes:
  - name: ID
    terraform_name: id
    type: string
    source_path: Id
    computed: true

  - name: EnvironmentID
    terraform_name: environment_id
    type: string
    source_path: Environment.Id
    required: true
    references_type: pingone_environment
    reference_field: id

  - name: Name
    terraform_name: name
    type: string
    source_path: Name
    required: true

  - name: Description
    terraform_name: description
    type: string
    source_path: Description

  - name: Default
    terraform_name: default
    type: bool
    source_path: Default

  - name: ExcludesCommonlyUsed
    terraform_name: excludes_commonly_used_passwords
    type: bool
    source_path: ExcludesCommonlyUsed

  - name: ExcludesProfileData
    terraform_name: excludes_profile_data
    type: bool
    source_path: ExcludesProfileData

  - name: NotSimilarToCurrent
    terraform_name: not_similar_to_current
    type: bool
    source_path: NotSimilarToCurrent

  - name: MaxAgeDays
    terraform_name: password_age_max
    type: number
    source_path: MaxAgeDays

  - name: MinAgeDays
    terraform_name: password_age_min
    type: number
    source_path: MinAgeDays

  - name: MaxRepeatedCharacters
    terraform_name: max_repeated_characters
    type: number
    source_path: MaxRepeatedCharacters

  - name: MinComplexity
    terraform_name: min_complexity
    type: number
    source_path: MinComplexity

  - name: MinUniqueCharacters
    terraform_name: min_unique_characters
    type: number
    source_path: MinUniqueCharacters

  - name: PopulationCount
    terraform_name: population_count
    type: number
    source_path: PopulationCount
    computed: true

  - name: History
    terraform_name: history
    type: object
    source_path: History
    nested_attributes:
      - name: Count
        terraform_name: count
        type: number
        source_path: Count
        required: true
      - name: RetentionDays
        terraform_name: retention_days
        type: number
        source_path: RetentionDays
        required: true

  - name: Length
    terraform_name: length
    type: object
    source_path: Length
    nested_attributes:
      - name: Min
        terraform_name: min
        type: number
        source_path: Min
        required: true
      - name: Max
        terraform_name: max
        type: number
        source_path: Max

  - name: Lockout
    terraform_name: lockout
    type: object
    source_path: Lockout
    nested_attributes:
      - name: DurationSeconds
        terraform_name: duration_seconds
        type: number
        source_path: DurationSeconds
        required: true
      - name: FailureCount
        terraform_name: failure_count
        type: number
        source_path: FailureCount
        required: true

  - name: MinCharacters
    terraform_name: min_characters
    type: object
    source_path: MinCharacters
    nested_attributes:
      - name: ABCDEFGHIJKLMNOPQRSTUVWXYZ
        terraform_name: alphabetical_uppercase
        type: number
        source_path: ABCDEFGHIJKLMNOPQRSTUVWXYZ
      - name: Abcdefghijklmnopqrstuvwxyz
        terraform_name: alphabetical_lowercase
        type: number
        source_path: Abcdefghijklmnopqrstuvwxyz
      - name: Var0123456789
        terraform_name: numeric
        type: number
        source_path: Var0123456789
      - name: SpecialChar
        terraform_name: special_characters
        type: number
        source_path: SpecialChar

  - name: AlphabetSequenceRule
    terraform_name: alphabet_sequence_rule
    type: object
    source_path: AlphabetSequenceRule
    nested_attributes:
      - name: MaxLength
        terraform_name: max_length
        type: number
        source_path: MaxLength

  - name: NumberSequenceRule
    terraform_name: number_sequence_rule
    type: object
    source_path: NumberSequenceRule
    nested_attributes:
      - name: MaxLength
        terraform_name: max_length
        type: number
        source_path: MaxLength

  - name: QwertySequenceRule
    terraform_name: qwerty_sequence_rule
    type: object
    source_path: QwertySequenceRule
    nested_attributes:
      - name: MaxLength
        terraform_name: max_length
        type: number
        source_path: MaxLength

  - name: ShiftedNumberRowSequenceRule
    terraform_name: shifted_number_row_sequence_rule
    type: object
    source_path: ShiftedNumberRowSequenceRule
    nested_attributes:
      - name: MaxLength
        terraform_name: max_length
        type: number
        source_path: MaxLength

dependencies:
  depends_on:
    - resource_type: pingone_environment
      field_path: Environment.Id
      lookup_field: id
      reference_format: "var.pingone_environment_id"

  import_id_format: "{env_id}/{resource_id}"

variables:
  eligible_attributes: []
