# PingOne Resource Secret Resource Definition
#
# pingone_resource_secret is a 1:1 singleton per CUSTOM pingone_resource —
# the management SDK's ResourceSecret struct has no Id field at all
# (Environment, Secret, Previous only), so resourceSecretData projects a
# synthetic ID equal to the owning resource's ID, mirroring
# application_secret.yaml. Only applies to CUSTOM resources, per provider
# docs ("generate and read a resource secret for an administrator defined
# resource").

metadata:
  platform: pingone
  resource_type: pingone_resource_secret
  api_type: ResourceSecret
  name: PingOne Resource Secret
  short_name: resource_secret
  version: "1.0"

api:
  sdk_package: github.com/patrickcping/pingone-go-sdk-v2/management
  sdk_type: ResourceSecret
  list_method: ResourceClientSecretApi.ReadResourceSecret
  get_method: ResourceClientSecretApi.ReadResourceSecret
  id_field: id
  name_field: resource_id
  label_fields: [resource_id]
  pagination_type: none

attributes:
  - name: ID
    terraform_name: id
    type: string
    source_path: ID
    computed: true

  - name: EnvironmentID
    terraform_name: environment_id
    type: string
    source_path: EnvironmentID
    required: true
    references_type: pingone_environment
    reference_field: id

  - name: ResourceID
    terraform_name: resource_id
    type: string
    source_path: ResourceID
    required: true
    references_type: pingone_resource
    reference_field: id

  - name: Secret
    terraform_name: secret
    type: string
    source_path: Secret
    computed: true
    sensitive: true

  - name: Previous
    terraform_name: previous
    type: object
    source_path: Previous
    nested_attributes:
      - name: Secret
        terraform_name: secret
        type: string
        source_path: Secret
        computed: true
        sensitive: true
      - name: ExpiresAt
        terraform_name: expires_at
        type: string
        source_path: ExpiresAt
      - name: LastUsed
        terraform_name: last_used
        type: string
        source_path: LastUsed
        computed: true

dependencies:
  depends_on:
    - resource_type: pingone_environment
      field_path: EnvironmentID
      lookup_field: id
      reference_format: "var.pingone_environment_id"
    - resource_type: pingone_resource
      field_path: ResourceID
      lookup_field: id
      reference_format: "pingone_resource.{name}.id"

  import_id_format: "{env_id}/{resource_id}"

variables:
  eligible_attributes: []
