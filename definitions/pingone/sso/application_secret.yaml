# PingOne Application Secret Resource Definition
#
# 1:1 singleton per pingone_application — the management SDK's
# ApplicationSecret struct has no Id field at all (Links, Environment,
# Secret, Previous only), so the Go handler projects a synthetic ID equal to
# the owning application's ID (applicationSecretData.ID below).
#
# regenerate_trigger_values (provider schema, Optional) has no API-side
# analog — it is a write-only meta-argument used to force secret rotation,
# not part of the resource's read state — so it is intentionally omitted here.

metadata:
  platform: pingone
  resource_type: pingone_application_secret
  api_type: ApplicationSecret
  name: PingOne Application Secret
  short_name: application_secret
  version: "1.0"

api:
  sdk_package: github.com/patrickcping/pingone-go-sdk-v2/management
  sdk_type: ApplicationSecret
  list_method: ApplicationSecretApi.ReadApplicationSecret
  get_method: ApplicationSecretApi.ReadApplicationSecret
  id_field: id
  name_field: id
  pagination_type: none

attributes:
  # ID - synthetic, equals the owning application's ID (see handler)
  - name: ID
    terraform_name: id
    type: string
    source_path: ID
    computed: true

  - name: EnvironmentID
    terraform_name: environment_id
    type: string
    source_path: EnvironmentID
    required: true
    references_type: pingone_environment
    reference_field: id

  - name: ApplicationID
    terraform_name: application_id
    type: string
    source_path: ApplicationID
    required: true
    references_type: pingone_application
    reference_field: id

  - name: Secret
    terraform_name: secret
    type: string
    source_path: Secret
    computed: true
    sensitive: true

  - name: Previous
    terraform_name: previous
    type: object
    source_path: Previous
    nested_attributes:
      - name: Secret
        terraform_name: secret
        type: string
        source_path: Secret
        computed: true
        sensitive: true
      - name: ExpiresAt
        terraform_name: expires_at
        type: string
        source_path: ExpiresAt
      - name: LastUsed
        terraform_name: last_used
        type: string
        source_path: LastUsed
        computed: true

dependencies:
  depends_on:
    - resource_type: pingone_environment
      field_path: EnvironmentID
      lookup_field: id
      reference_format: "var.pingone_environment_id"
    - resource_type: pingone_application
      field_path: ApplicationID
      lookup_field: id
      reference_format: "pingone_application.{name}.id"

  import_id_format: "{env_id}/{application_id}"

variables:
  eligible_attributes: []
