# PingOne OpenID Connect Resource Scope Definition
#
# Scopes on the built-in OPENID_CONNECT resource (implicit per environment —
# there is exactly one, so resource_id is computed rather than a required
# input). Same underlying SDK type/API (ResourceScope / ResourceScopesApi) as
# pingone_resource_scope and pingone_resource_scope_pingone_api; the split
# into three Terraform resource types mirrors the provider's own modeling.
# The Go handler resolves the built-in OIDC resource's ID once, then lists
# its scopes.

metadata:
  platform: pingone
  resource_type: pingone_resource_scope_openid
  api_type: ResourceScope
  name: PingOne OpenID Connect Resource Scope
  short_name: resource_scope_openid
  version: "1.0"

api:
  sdk_package: github.com/patrickcping/pingone-go-sdk-v2/management
  sdk_type: ResourceScope
  list_method: ResourceScopesApi.ReadAllResourceScopes
  get_method: ResourceScopesApi.ReadOneResourceScope
  id_field: id
  name_field: name
  pagination_type: cursor

attributes:
  - name: ID
    terraform_name: id
    type: string
    source_path: Id
    computed: true

  - name: EnvironmentID
    terraform_name: environment_id
    type: string
    source_path: Environment.Id
    required: true
    references_type: pingone_environment
    reference_field: id

  - name: ResourceID
    terraform_name: resource_id
    type: string
    source_path: Resource.Id
    computed: true

  - name: Name
    terraform_name: name
    type: string
    source_path: Name
    required: true

  - name: Description
    terraform_name: description
    type: string
    source_path: Description

  - name: MappedClaims
    terraform_name: mapped_claims
    type: set
    source_path: MappedClaims

dependencies:
  depends_on:
    - resource_type: pingone_environment
      field_path: Environment.Id
      lookup_field: id
      reference_format: "var.pingone_environment_id"

  import_id_format: "{env_id}/{id}"

variables:
  eligible_attributes: []
