# PingOne Application Sign-On Policy Assignment Resource Definition
#
# Children of pingone_application. sign_on_policy_id references
# pingone_sign_on_policy, implemented alongside this resource in the same
# batch (see sign_on_policy.yaml) so the reference resolves to a real
# resource, not a fallback variable.

metadata:
  platform: pingone
  resource_type: pingone_application_sign_on_policy_assignment
  api_type: SignOnPolicyAssignment
  name: PingOne Application Sign-On Policy Assignment
  short_name: application_sign_on_policy_assignment
  version: "1.0"

api:
  sdk_package: github.com/patrickcping/pingone-go-sdk-v2/management
  sdk_type: SignOnPolicyAssignment
  list_method: ApplicationSignOnPolicyAssignmentsApi.ReadAllSignOnPolicyAssignments
  get_method: ApplicationSignOnPolicyAssignmentsApi.ReadOneSignOnPolicyAssignment
  id_field: id
  name_field: id
  pagination_type: cursor
  additional_id_fields:
    - application_id

attributes:
  - name: ID
    terraform_name: id
    type: string
    source_path: Id
    computed: true

  - name: EnvironmentID
    terraform_name: environment_id
    type: string
    required: true
    references_type: pingone_environment
    reference_field: id

  - name: ApplicationID
    terraform_name: application_id
    type: string
    source_path: Application.Id
    required: true
    references_type: pingone_application
    reference_field: id

  - name: SignOnPolicyID
    terraform_name: sign_on_policy_id
    type: string
    source_path: SignOnPolicy.Id
    required: true
    references_type: pingone_sign_on_policy
    reference_field: id

  - name: Priority
    terraform_name: priority
    type: number
    source_path: Priority
    required: true

dependencies:
  depends_on:
    - resource_type: pingone_environment
      field_path: EnvironmentID
      lookup_field: id
      reference_format: "var.pingone_environment_id"
    - resource_type: pingone_application
      field_path: Application.Id
      lookup_field: id
      reference_format: "pingone_application.{name}.id"
    - resource_type: pingone_sign_on_policy
      field_path: SignOnPolicy.Id
      lookup_field: id
      reference_format: "pingone_sign_on_policy.{name}.id"

  import_id_format: "{env_id}/{application_id}/{id}"

variables:
  eligible_attributes: []
